name: sync with upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: mirror upstream branches
        env:
          BRANCHES: "main premium"
        run: |
          git remote add up https://github.com/PluralKit/PluralKit.git
          git fetch up --tags
          for b in $BRANCHES; do
            git push origin "refs/remotes/up/$b:refs/heads/upstream/$b" --force
          done
          git push origin --tags
