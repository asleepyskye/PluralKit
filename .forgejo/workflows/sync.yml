name: sync with upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: nodejs-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mirror upstream branches
        env:
          BRANCHES: "main premium"
        run: |
          git remote add up https://github.com/PluralKit/PluralKit.git
          git fetch up --tags
          for b in $BRANCHES; do
            git push origin "refs/remotes/up/$b:refs/heads/upstream/$b" --force
          done
          git push origin --tags
