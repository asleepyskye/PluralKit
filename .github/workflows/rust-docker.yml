name: Build and push Rust service Docker images
on:
  push:
    paths:
    - 'crates/**'
    - '.dockerignore'
    - '.github/workflows/rust.yml'
    - '.github/workflows/rust-docker.yml'
    - 'ci/Dockerfile.rust'
    - 'ci/rust-docker-target.sh'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'flake.nix'
    - 'flake.lock'

jobs:
  build:
    name: 'rust docker build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    #if: github.repository == 'PluralKit/PluralKit'
    steps:
      - run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          summarize: false
      - uses: cachix/cachix-action@v15
        with:
          name: asleepyskye-pluralkit-testing
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          SERVICES="gateway api migrate dispatch avatars avatar_cleanup scheduled_tasks gdpr_worker"
          for SERVICE in $SERVICES; do
            nix build .#docker-$SERVICE
            ./result | docker load

            IMAGE_NAME="${{ github.repository_owner }}/$SERVICE"
            IMAGE_ID=$(echo "ghcr.io/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            TAG="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"

            docker tag pluralkit-$SERVICE:latest $IMAGE_ID:$TAG
            docker push $IMAGE_ID:$TAG

            docker tag pluralkit-$SERVICE:latest $IMAGE_ID:$BRANCH
            docker push $IMAGE_ID:$BRANCH

            if ["$BRANCH" == "main"]; then
              docker tag pluralkit-$SERVICE:latest $IMAGE_ID:latest
              docker push $IMAGE_ID:latest
            fi
          done
          